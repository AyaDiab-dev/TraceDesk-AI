# Simulated systems for the IT Helpdesk Agent mini-project.
#   docker compose up --build       -> helpdesk API on http://localhost:8102
# Add your own app below (uncomment the app: block) so one command starts everything.
services:
  helpdesk-api:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8102:8102"
    environment:
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-dev-key-change-me}
      HELPDESK_TODAY: ${HELPDESK_TODAY:-}
    restart: unless-stopped

  # app:
  #   build: .                      # your Dockerfile: your FastAPI app on port 8000
  #   ports:
  #     - "8001:8000"
  #   env_file: .env
  #   environment:
  #     # inside compose the API is reached by its service name, not localhost
  #     HELPDESK_API_URL: http://helpdesk-api:8102
  #     HELPDESK_API_KEY: ${HELPDESK_API_KEY:-dev-key-change-me}
  #   # your image must contain services/helpdesk_mcp.py, mcp and httpx: your app starts
  #   # the MCP server as a subprocess (python -m services.helpdesk_mcp) over stdio
  #   depends_on:
  #     helpdesk-api:
  #       condition: service_healthy
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      HELPDESK_API_URL: http://helpdesk-api:8102
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-dev-key-change-me}
    depends_on:
      helpdesk-api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://app:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  frontend_node_modules: